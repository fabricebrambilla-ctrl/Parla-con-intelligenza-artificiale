<!doctype html>
<html lang="{{htmlLang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title">{{title}}</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#142235">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="voice-page" data-new-langs="{{newLangs}}">
  <main class="voice-panel">
    <h1 data-i18n="h1">{{h1}}</h1>
    <!-- Agreement by pressing Start: read before the button, and part of the button's description.
         No whitespace between the parts: a lone space becomes an empty stop for VoiceOver swipes. -->
    <p id="agree" class="agree"><span data-i18n="agreeBefore">{{agreeBefore}}</span><a id="privacyLink" href="/privacy?lang={{pageLang}}" data-i18n="agreePrivacy">{{agreePrivacy}}</a><span data-i18n="agreeAnd">{{agreeAnd}}</span><a id="termsLink" href="/terms?lang={{pageLang}}" data-i18n="agreeTerms">{{agreeTerms}}</a><span data-i18n="agreeAfter">{{agreeAfter}}</span></p>
    <!-- Native button activation is preserved for assistive technology. -->
    <button id="talk" type="button" class="talk" autofocus aria-keyshortcuts="Alt+Shift+T" aria-describedby="agree helpText">{{start}}</button>
    <button id="installApp" type="button" data-i18n="installLabel" hidden>{{installLabel}}</button>
    <button id="endConv" type="button" data-i18n="end" hidden>{{end}}</button>
    <button id="lang" type="button" aria-expanded="false" data-i18n="langButton">{{langButton}}</button>
    <div id="langs" role="group" aria-labelledby="lang" hidden>
      <button type="button" lang="en" data-set-lang="en">English</button>
      <button type="button" lang="it" data-set-lang="it">Italiano</button>
      <button type="button" lang="fr" data-set-lang="fr">Français</button>
      <button type="button" lang="bg" data-set-lang="bg">Български</button>
      <button type="button" lang="ru" data-set-lang="ru">Русский</button>
      <button type="button" lang="zh-Hans" data-set-lang="zh">中文</button>
      <button type="button" lang="ja" data-set-lang="ja">日本語</button>
      <!-- Removed by the page while NEW_LANGUAGES does not switch them on. -->
      <button type="button" lang="nl" data-set-lang="nl">Nederlands</button>
      <button type="button" lang="pt-PT" data-set-lang="pt">Português</button>
    </div>
    <!-- Shown only when two or more microphones exist; names are readable only after permission. -->
    <button id="micBtn" type="button" aria-expanded="false" data-i18n="micButton" hidden>{{micButton}}</button>
    <div id="mics" role="group" aria-labelledby="micBtn" hidden></div>
    <!-- Off by default: appears once the user says "show the last answer", or when the assistant
         puts long content (steps, code, a list) here instead of reading it all out. -->
    <button id="lastBtn" type="button" aria-expanded="false" aria-controls="lastBox" data-i18n="lastButton" hidden>{{lastButton}}</button>
    <section id="lastBox" class="last" aria-labelledby="lastHeading" hidden>
      <h2 id="lastHeading" data-i18n="lastHeading">{{lastHeading}}</h2>
      <div id="lastText" class="last-text"></div>
      <button id="copyBtn" type="button" data-i18n="copyButton">{{copyButton}}</button>
      <p id="copyStatus" role="status"></p>
    </section>
    <!-- The help is read as the Talk button's description; hidden here so screen readers don't read it twice. -->
    <p class="help"><span id="helpText" data-i18n="help" aria-hidden="true">{{help}}</span></p>
    <!-- Focus announces this explanation once, before the browser permission prompt. -->
    <div id="micPermission" tabindex="-1"></div>
    <div id="alert" role="alert"></div>
  </main>
  <footer>
    <a id="aboutLink" href="/about?lang={{pageLang}}" data-i18n="aboutLink">{{aboutLink}}</a>
    <a id="accessibilityLink" href="/accessibility?lang={{pageLang}}" data-i18n="accessibilityLink">{{accessibilityLink}}</a>
    <a id="instructionsLink" href="/instructions?lang={{pageLang}}" data-i18n="instructionsLink">{{instructionsLink}}</a>
  </footer>
  <script src="/i18n.js"></script>
  <script src="/app-capabilities.js"></script>
  <script src="/install.js"></script>
  <script src="/app.js"></script>
</body>
</html>
