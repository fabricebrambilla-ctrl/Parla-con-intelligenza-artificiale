<!doctype html>
<html lang="{{htmlLang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title">{{title}}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="voice-page">
  <main class="voice-panel">
    <h1 data-i18n="h1">{{h1}}</h1>
    <!-- Focused on load: screen readers announce it with its description, and Space works at once.
         Space/Enter in browse mode (NVDA) / virtual cursor (JAWS) arrive as a click on this button. -->
    <button id="talk" type="button" class="talk" autofocus aria-keyshortcuts="Alt+Shift+T" aria-describedby="helpText">{{start}}</button>
    <button id="endConv" type="button" data-i18n="end" hidden>{{end}}</button>
    <button id="lang" type="button" aria-expanded="false" data-i18n="langButton">{{langButton}}</button>
    <div id="langs" role="group" aria-labelledby="lang" hidden>
      <button type="button" lang="en" data-set-lang="en">English</button>
      <button type="button" lang="it" data-set-lang="it">Italiano</button>
      <button type="button" lang="fr" data-set-lang="fr">Français</button>
      <button type="button" lang="bg" data-set-lang="bg">Български</button>
      <button type="button" lang="ru" data-set-lang="ru">Русский</button>
      <button type="button" lang="zh-Hans" data-set-lang="zh">中文</button>
      <button type="button" lang="ja" data-set-lang="ja">日本語</button>
    </div>
    <!-- The help is read as the Talk button's description; hidden here so screen readers don't read it twice.
         No space between the spans: a lone space becomes an empty stop for VoiceOver swipes. -->
    <p class="help"><span id="helpText" data-i18n="help" aria-hidden="true">{{help}}</span><span class="privacy" data-i18n="privacy">{{privacy}}</span></p>
    <!-- Focus announces this explanation once, before the browser permission prompt. -->
    <div id="micPermission" tabindex="-1"></div>
    <div id="alert" role="alert"></div>
  </main>
  <footer>
    <a id="aboutLink" href="/about?lang={{pageLang}}" data-i18n="aboutLink">{{aboutLink}}</a>
    <a id="privacyLink" href="/privacy?lang={{pageLang}}" data-i18n="privacyLink">{{privacyLink}}</a>
    <a id="accessibilityLink" href="/accessibility?lang={{pageLang}}" data-i18n="accessibilityLink">{{accessibilityLink}}</a>
  </footer>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
